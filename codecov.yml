coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 5%
        informational: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default

flag_management:
  individual_flags:
    - name: unittests
      carryforward: true
    - name: nightly
      carryforward: true

ignore:
  - tests/
  - hack/
  - scripts/
  - cmd/gather/main.go
