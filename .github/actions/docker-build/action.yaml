name: Docker Build (Hermetic)
description: Build must-gather image hermetically using Hermeto (offline/reproducible build)
inputs:
  imageName:
    description: The full image name including registry (e.g., quay.io/rhdh-community/rhdh-must-gather)
    required: true
  imageTags:
    description: The tags to apply to the image
    required: true
  imageLabels:
    description: The labels for the Docker image
    required: false
  platform:
    description: "Target given CPU platform architecture (default: linux/amd64)"
    required: false
    default: linux/amd64
  containerfilePath:
    description: Path to the Konflux/hermetic Containerfile
    required: false
    default: '.rhdh/docker/Containerfile'
  buildArgs:
    description: Build arguments to pass to buildah (newline-separated KEY=VALUE pairs)
    required: false
    default: ''
  skipArtifactUpload:
    description: Skip uploading the built image as a GitHub artifact
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.imageName }}
        tags: |
          ${{ inputs.imageTags }}
        labels: |
          ${{ inputs.imageLabels }}

    - name: Ensure podman is available
      shell: bash
      run: |
        if ! command -v podman &>/dev/null; then
          echo "podman not found, installing..."
          sudo apt-get -y update && sudo apt-get -y install podman
        fi
        podman --version

    - name: Set up hermetic build variables
      shell: bash
      run: |
        # renovate: datasource=docker depName=quay.io/konflux-ci/hermeto
        echo "HERMETO_IMAGE=quay.io/konflux-ci/hermeto:0.60.1" >> "$GITHUB_ENV"
        echo "LOCAL_CACHE_DIR=/tmp/hermeto-cache/rhdh-must-gather" >> "$GITHUB_ENV"

    - name: Restore hermeto dependency cache
      id: cache-deps
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/hermeto-cache/rhdh-must-gather
        key: hermeto-deps-${{ inputs.platform }}-${{ hashFiles('go.mod', 'go.sum', 'rpms.lock.yaml') }}

    - name: Fetch dependencies with hermeto
      if: steps.cache-deps.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -ex

        mkdir -p "$LOCAL_CACHE_DIR"

        echo "::group::Fetching dependencies with hermeto"
        podman run --rm -v "$PWD:/source:z" -v "$LOCAL_CACHE_DIR:/cachi2:z" -w /source "$HERMETO_IMAGE" \
          --log-level DEBUG \
          fetch-deps \
          --source . \
          --output /cachi2/output \
          '[{"type": "rpm", "path": "."}, {"type": "gomod", "path": "."}]'
        echo "::endgroup::"

        if [ ! -d "$LOCAL_CACHE_DIR/output" ]; then
          echo "No output directory found after fetch-deps"
          exit 1
        fi

        echo "::group::Generating environment file"
        podman run --rm -v "$PWD:/source:z" -v "$LOCAL_CACHE_DIR:/cachi2:z" -w /source "$HERMETO_IMAGE" \
          --log-level DEBUG \
          generate-env --format env \
          --output /cachi2/cachi2.env /cachi2/output
        echo "::endgroup::"

        echo "::group::Injecting files"
        podman run --rm -v "$PWD:/source:z" -v "$LOCAL_CACHE_DIR:/cachi2:z" -w /source "$HERMETO_IMAGE" \
          --log-level DEBUG \
          inject-files /cachi2/output
        echo "::endgroup::"

    - name: Generate env and inject files (cache hit)
      if: steps.cache-deps.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -ex
        echo "::group::Generating environment file from cached deps"
        podman run --rm -v "$PWD:/source:z" -v "$LOCAL_CACHE_DIR:/cachi2:z" -w /source "$HERMETO_IMAGE" \
          --log-level DEBUG \
          generate-env --format env \
          --output /cachi2/cachi2.env /cachi2/output
        echo "::endgroup::"

        echo "::group::Injecting files from cached deps"
        podman run --rm -v "$PWD:/source:z" -v "$LOCAL_CACHE_DIR:/cachi2:z" -w /source "$HERMETO_IMAGE" \
          --log-level DEBUG \
          inject-files /cachi2/output
        echo "::endgroup::"

    - name: Fix cache ownership for non-root buildah
      shell: bash
      run: |
        set -ex
        echo "LOCAL_CACHE_DIR_REALPATH=$(realpath "$LOCAL_CACHE_DIR")" >> "$GITHUB_ENV"
        sudo chown -R runner "$(realpath "$LOCAL_CACHE_DIR")"
        sudo chmod -R a+rwX "$(realpath "$LOCAL_CACHE_DIR")"

    - name: Build Docker Image
      id: build
      uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
      with:
        containerfiles: ${{ inputs.containerfilePath }}
        context: .
        platform: ${{ inputs.platform }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.buildArgs }}
        extra-args: |
          --network=none
          --volume ${{ env.LOCAL_CACHE_DIR_REALPATH }}:/cachi2:z

    - name: Save image as artifact
      if: ${{ inputs.skipArtifactUpload != 'true' }}
      shell: bash
      env:
        TAGS_LIST: ${{ steps.meta.outputs.tags }}
      run: |
        mkdir -p ./podman-artifacts
        echo "Saving images with tags:"
        echo "$TAGS_LIST"
        readarray -t tags <<< "$TAGS_LIST"
        podman save "${tags[@]}" -o ./podman-artifacts/image.tar
        echo "$TAGS_LIST" > ./podman-artifacts/tags.txt

    - name: Upload image artifact
      if: ${{ inputs.skipArtifactUpload != 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: podman-image-${{ github.event.number || github.ref_name }}
        path: ./podman-artifacts/
        retention-days: 1
        if-no-files-found: error
