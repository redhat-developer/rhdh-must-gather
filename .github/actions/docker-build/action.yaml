name: Docker Build (Hermetic)
description: Build a container image hermetically using Hermeto (Konflux CI)
inputs:
  imageName:
    description: The full image name including registry (e.g., quay.io/rhdh-community/rhdh-must-gather)
    required: true
  imageTags:
    description: The tags to apply to the image
    required: true
  imageLabels:
    description: The labels for the Docker image
    required: false
  platform:
    description: "Target given CPU platform architecture (default: linux/amd64)"
    required: false
    default: linux/amd64
  containerfilePath:
    description: Path to the Containerfile to use
    required: false
    default: '.rhdh/docker/Containerfile'
  buildArgs:
    description: Build arguments to pass to buildah (newline-separated KEY=VALUE pairs)
    required: false
    default: ''
  skipArtifactUpload:
    description: Skip uploading the built image as a GitHub artifact
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: false
        swap-storage: false

    - name: Extract metadata (tags, labels, annotations) for Docker
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
      with:
        images: ${{ inputs.imageName }}
        tags: |
          ${{ inputs.imageTags }}
        labels: |
          ${{ inputs.imageLabels }}

    - name: Set up hermetic build variables
      shell: bash
      run: |
        # Pin by digest for reproducibility
        echo "HERMETO_IMAGE=quay.io/konflux-ci/hermeto@sha256:de5398035bee2965a275313654f51c80e213ae460b6ec5a23e32c81efd00e67b" >> $GITHUB_ENV
        echo "LOCAL_CACHE_DIR=./hermeto-cache/rhdh-must-gather" >> $GITHUB_ENV

    - name: Prepare hermetic build context
      shell: bash
      run: |
        set -ex
        # Copy requirements files to repo root — matches sync-midstream.sh.
        # Needed for: (1) hermeto pip fetcher discovery at path "."
        #             (2) .rhdh/docker/Containerfile COPY instructions
        for f in .rhdh/docker/requirements*.txt; do
          cp "$f" .
        done
        ls -la requirements*.txt

    - name: Cache dependencies with hermeto
      shell: bash
      run: |
        set -ex

        echo "::group::Creating local cache directory"
        mkdir -p ${{ env.LOCAL_CACHE_DIR }} || echo "Failed to create local cache directory"
        echo "::endgroup::"

        echo "::group::Fetching dependencies with hermeto"
        podman run --rm -v "$PWD:/source:z" -v "$LOCAL_CACHE_DIR:/cachi2:z" -w /source "$HERMETO_IMAGE" \
          --log-level DEBUG \
          fetch-deps --dev-package-managers \
          --source . \
          --output /cachi2/output \
          '[{"type": "rpm", "path": "."}, {"type": "pip", "path": ".", "allow_binary": "false"}, {"type": "generic", "path": "."}, {"type": "cargo", "path": "vendor/websocat"}]'
        echo "::endgroup::"

        if [ -d ${{ env.LOCAL_CACHE_DIR }}/output ]; then
          echo "::group::Generating environment file"
          podman run --rm -v "$PWD:/source:z" -v "$LOCAL_CACHE_DIR:/cachi2:z" -w /source "$HERMETO_IMAGE" \
                      --log-level DEBUG \
                      generate-env --format env \
                      --output /cachi2/cachi2.env /cachi2/output
          echo "::endgroup::"
        else
          echo "No output directory found, skipping generate-env"
          exit 1
        fi

        if [ -d ${{ env.LOCAL_CACHE_DIR }}/output ]; then
          echo "::group::Injecting files"
          podman run --rm -v "$PWD:/source:z" -v "$LOCAL_CACHE_DIR:/cachi2:z" -w /source "$HERMETO_IMAGE" \
            --log-level DEBUG \
            inject-files /cachi2/output
          echo "::endgroup::"
        else
          echo "No output directory found, skipping inject-files"
          exit 1
        fi

        echo "LOCAL_CACHE_DIR_REALPATH=$(realpath "${{ env.LOCAL_CACHE_DIR }}")" >> "$GITHUB_ENV"

    - name: "Fix Cache Ownership for Non-Root Buildah"
      shell: bash
      run: |
        set -ex
        echo "::group::Fixing cache ownership"

        echo "=== Before ownership fix ==="
        ls -l ${{ env.LOCAL_CACHE_DIR_REALPATH }}

        echo "=== Attempting to fix ownership to runner user ==="
        sudo chown -R runner ${{ env.LOCAL_CACHE_DIR_REALPATH }}

        echo "=== After ownership fix ==="
        ls -l ${{ env.LOCAL_CACHE_DIR_REALPATH }}

        echo "::endgroup::"

    - name: "Build Docker Image"
      id: build
      uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
      with:
        containerfiles: ${{ inputs.containerfilePath }}
        context: .
        platform: ${{ inputs.platform }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.buildArgs }}
        extra-args: |
          --network=none
          --volume ${{ env.LOCAL_CACHE_DIR_REALPATH }}:/cachi2:z

    - name: Save image as artifact
      if: ${{ inputs.skipArtifactUpload != 'true' }}
      shell: bash
      env:
        TAGS_LIST: ${{ steps.meta.outputs.tags }}
      run: |
        echo "::group::Saving image and metadata for artifact"
        mkdir -p ./podman-artifacts

        echo "Saving images with tags:"
        echo "$TAGS_LIST"

        podman save $TAGS_LIST -o ./podman-artifacts/image.tar

        echo "$TAGS_LIST" > ./podman-artifacts/tags.txt
        echo "::endgroup::"

    - name: Upload image artifact
      if: ${{ inputs.skipArtifactUpload != 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: podman-image-${{ github.event.number || github.ref_name }}
        path: ./podman-artifacts/
        retention-days: 1
        if-no-files-found: error
