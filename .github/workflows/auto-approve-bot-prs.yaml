name: Auto-Approve Bot PRs

# Adds lgtm/approved, a GitHub review, and GitHub auto-merge (squash) for
# generated PRs (base-image bumps, RPM lockfile updates). This repo has no
# Prow Tide, so --auto is what actually merges after required checks pass.
#
# pull_request_target runs this file from the *base* branch, so every
# release-* line needs the same debounce. updateBaseImages.sh opens the PR
# on the first image bump and pushes another commit seconds later.
# Wait 10s after the triggering commit and skip if HEAD moved. A later
# synchronize run (with cancel-in-progress) applies labels 10s after the
# last push.
# labeled is omitted so adding lgtm/approved does not retrigger this workflow.
#
# Authors: rhdh-bot (updateBaseImages.sh / RHDH_BOT_TOKEN) and
# github-actions[bot] (GITHUB_TOKEN fallback when the bot token is unset).

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: auto-approve-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-approve:
    name: Auto-Approve and Label PRs
    runs-on: ubuntu-latest

    if: >-
      github.event.pull_request.user.login == 'rhdh-bot'
      || github.event.pull_request.user.login == 'github-actions[bot]'

    steps:
      - name: Check PR eligibility
        id: check-eligibility
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [[ "$PR_DRAFT" == "true" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "reason=PR is in draft state" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ELIGIBLE_PATTERNS=(
            "^chore/automated-.*"
          )

          ELIGIBLE=false
          for pattern in "${ELIGIBLE_PATTERNS[@]}"; do
            if [[ "$PR_BRANCH" =~ $pattern ]]; then
              ELIGIBLE=true
              break
            fi
          done

          if [[ "$ELIGIBLE" == "true" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait until HEAD is stable
        id: debounce
        if: steps.check-eligibility.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          DEBOUNCE_SECONDS=10
          echo "Waiting ${DEBOUNCE_SECONDS}s after ${EVENT_SHA} so later commits can land."
          sleep "${DEBOUNCE_SECONDS}"

          CURRENT_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          if [[ "${CURRENT_SHA}" != "${EVENT_SHA}" ]]; then
            echo "HEAD moved during debounce (${EVENT_SHA} -> ${CURRENT_SHA}); skipping so the newer run can label."
            echo "stable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "HEAD unchanged for ${DEBOUNCE_SECONDS}s: ${CURRENT_SHA}"
          echo "stable=true" >> "$GITHUB_OUTPUT"

      - name: Add required labels, approve, and enable auto-merge
        if: steps.check-eligibility.outputs.eligible == 'true' && steps.debounce.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create approved \
            --repo "$GITHUB_REPOSITORY" \
            --color 0E8A16 \
            --description "Indicates a PR has been approved." \
            --force >/dev/null 2>&1 || true
          gh label create lgtm \
            --repo "$GITHUB_REPOSITORY" \
            --color 15dd18 \
            --description "Indicates that a PR is ready to be merged." \
            --force >/dev/null 2>&1 || true

          gh pr edit "$PR_NUMBER" --add-label "lgtm,approved" --repo "$GITHUB_REPOSITORY"

          gh pr review "$PR_NUMBER" \
            --approve \
            --repo "$GITHUB_REPOSITORY" \
            --body "**Auto-Approved**

          This PR has been automatically approved by the auto-approve workflow.

          **Labels Added:** \`lgtm\`, \`approved\`"

          gh pr merge "$PR_NUMBER" --squash --auto --repo "$GITHUB_REPOSITORY"
