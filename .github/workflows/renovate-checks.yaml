name: PR Renovate Config Validator

on:
  pull_request:
    # Renovate always uses the config from the repository default branch
    # https://docs.renovatebot.com/configuration-options/
    branches: [ 'main' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  renovate-config-validator:
    runs-on: ubuntu-latest
    name: Renovate Config Validator
    # Avoids npx lifecycle scripts (Sonar S6505). tag@digest so Renovate can bump both.
    container:
      image: ghcr.io/renovatebot/renovate:44.145.1@sha256:6f1f3e2d9d0c3f99aa1f61f7509d302185de7deb173ac8c5ff88a5ce283ec435 # 44.145.1
      # Match GitHub-hosted runner UID so actions/checkout can write to /__w/_temp
      # https://github.com/renovatebot/github-action/blob/main/.github/workflows/build.yml
      options: --user 1001:0 --group-add 1000 --group-add 12021 --group-add 127
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            .github/renovate.json

      - name: Validate config
        if: steps.changed-files.outputs.any_changed == 'true'
        # See https://docs.renovatebot.com/config-validation/
        run: renovate-config-validator --strict .github/renovate.json

      - name: Validate JSONata expressions
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Extract and validate all transformTemplates JSONata expressions
          # renovate: datasource=npm
          npm install --no-save jsonata@2.2.2
          jq -r '.. | .transformTemplates? // empty | .[]' .github/renovate.json | while IFS= read -r expr; do
            echo "Validating: $expr"
            node -e "const jsonata = require('jsonata'); jsonata(process.argv[1])" "$expr" || exit 1
          done
