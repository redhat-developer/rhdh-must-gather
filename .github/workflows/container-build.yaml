name: Container image build

on:
  push:
    branches:
    - main
    - 'release-[0-9]+.[0-9]+'
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ vars.REGISTRY_ORG }}/rhdh-must-gather

jobs:
  prepare:
    name: Prepare build variables
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      image-tag: ${{ steps.prep.outputs.IMAGE_TAG }}
      extra-tags: ${{ steps.prep.outputs.EXTRA_TAGS }}
      version: ${{ steps.prep.outputs.VERSION }}
      short-sha: ${{ steps.prep.outputs.SHORT_SHA }}
      expiration-timestamp: ${{ steps.prep.outputs.EXPIRATION_TIMESTAMP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Generate image tags and build args based on ref type
      - name: Prepare build variables
        id: prep
        run: |
          SHORT_SHA=$(git rev-parse --short=9 HEAD)

          # Calculate expiration date (2 weeks from now as Unix timestamp)
          EXPIRATION_TIMESTAMP=$(date -u -d "+14 days" +"%s")
          echo "EXPIRATION_TIMESTAMP=${EXPIRATION_TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          IMAGE_TAG=""
          EXTRA_TAGS=""
          VERSION=""

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Git tag: push the tag version and derive major/minor tags
            TAG_VERSION=${GITHUB_REF#refs/tags/}
            IMAGE_TAG="${TAG_VERSION}"
            VERSION="${TAG_VERSION}"

            # Parse semantic version to extract major and major.minor
            if [[ ${TAG_VERSION} =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              EXTRA_TAGS="${MAJOR} ${MAJOR}.${MINOR}"
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Main branch: push latest and latest-${commit}
            IMAGE_TAG="latest"
            EXTRA_TAGS="latest-${SHORT_SHA}"
            VERSION="0.0.0-$(git describe --no-match --always --abbrev=9 --dirty --broken 2>/dev/null || echo unknown)"
          elif [[ "${{ github.ref }}" == refs/heads/release-* ]]; then
            # Release branch: extract version and push latest-1.x and latest-1.x-${commit}
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            RELEASE_VERSION=${BRANCH_NAME#release-}
            IMAGE_TAG="latest-${RELEASE_VERSION}"
            EXTRA_TAGS="latest-${RELEASE_VERSION}-${SHORT_SHA}"
            VERSION="0.0.0-$(git describe --no-match --always --abbrev=9 --dirty --broken 2>/dev/null || echo unknown)"
          fi

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "EXTRA_TAGS=${EXTRA_TAGS}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Container Image (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log into registry ${{ vars.REGISTRY }}
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # Each arch is built natively on a matching runner and pushed to a
      # temporary arch-specific tag. Final tags are only ever written by the
      # manifest job, so a partial failure never leaves a single-arch image
      # behind on a public tag.
      - name: Build container image (hermetic)
        uses: ./.github/actions/docker-build
        with:
          imageName: ${{ vars.REGISTRY }}/${{ env.IMAGE_NAME }}
          imageTags: |
            ${{ needs.prepare.outputs.short-sha }}-arch-${{ matrix.arch }}
          buildArgs: |
            RHDH_MUST_GATHER_VERSION=${{ needs.prepare.outputs.version }}
          platform: ${{ matrix.platform }}
          skipArtifactUpload: 'true'

      - name: Push per-arch image
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE: ${{ env.IMAGE_NAME }}
          ARCH_TAG: ${{ needs.prepare.outputs.short-sha }}-arch-${{ matrix.arch }}
        run: |
          REF="${REGISTRY}/${IMAGE}:${ARCH_TAG}"
          echo "Pushing per-arch image: ${REF}"
          podman push "${REF}"

  manifest:
    name: Publish multi-arch manifest list
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Log into registry ${{ vars.REGISTRY }}
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # Install the cosign tool
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Push multi-arch manifest lists
        id: push
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE: ${{ env.IMAGE_NAME }}
          MAIN_TAG: ${{ needs.prepare.outputs.image-tag }}
          EXTRA_TAGS: ${{ needs.prepare.outputs.extra-tags }}
          SHORT_SHA: ${{ needs.prepare.outputs.short-sha }}
        run: |
          IMAGE_REF="${REGISTRY}/${IMAGE}"
          AMD64_REF="${IMAGE_REF}:${SHORT_SHA}-arch-amd64"
          ARM64_REF="${IMAGE_REF}:${SHORT_SHA}-arch-arm64"

          DIGEST=""
          for TAG in ${MAIN_TAG} ${EXTRA_TAGS}; do
            REF="${IMAGE_REF}:${TAG}"

            echo "Creating manifest list for ${REF}"
            podman manifest rm "${REF}" >/dev/null 2>&1 || true
            podman manifest create "${REF}"
            podman manifest add "${REF}" "docker://${AMD64_REF}"
            podman manifest add "${REF}" "docker://${ARM64_REF}"

            if [[ -n "${DIGEST}" ]]; then
              # Every tag must reference the same manifest list
              podman manifest push --digestfile /tmp/digest.tmp "${REF}"
              TMP_DIGEST=$(cat /tmp/digest.tmp)
              if [[ "${TMP_DIGEST}" != "${DIGEST}" ]]; then
                echo "::error::Manifest list digest mismatch for ${REF}: ${TMP_DIGEST} != ${DIGEST}"
                exit 1
              fi
            else
              podman manifest push --digestfile /tmp/digest "${REF}"
              DIGEST=$(cat /tmp/digest)
            fi

            echo "${REF}" >> /tmp/image-tags.txt
            if [[ ${TAG} == latest-* ]]; then
              echo "${TAG}" >> /tmp/expiry-tags.txt
            fi
          done

          echo "Manifest list digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Set expiration on commit-SHA tags via Quay.io API
      # Note: This requires an OAuth Application token, not a robot account token
      # Create an OAuth app in Quay.io and store the token as QUAY_OAUTH_TOKEN secret
      - name: Set expiration on commit-SHA tags
        if: needs.prepare.outputs.extra-tags != ''
        env:
          # Use QUAY_OAUTH_TOKEN if available, otherwise fall back to QUAY_TOKEN
          API_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN || secrets.QUAY_TOKEN }}
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE: ${{ env.IMAGE_NAME }}
          EXPIRATION_TIMESTAMP: ${{ needs.prepare.outputs.expiration-timestamp }}
        run: |
          # Check if there are any commit-SHA tags to expire
          if [ ! -f /tmp/expiry-tags.txt ]; then
            echo "No commit-SHA tags to set expiration on"
            exit 0
          fi

          # Extract namespace and repo name from IMAGE_NAME
          NAMESPACE=$(echo "${IMAGE}" | cut -d'/' -f1)
          REPO=$(echo "${IMAGE}" | cut -d'/' -f2)

          # Set expiration for each commit-SHA tag
          while IFS= read -r TAG; do
            echo "Setting expiration on ${TAG} to ${EXPIRATION_TIMESTAMP} (Unix timestamp)"
            RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"expiration\": ${EXPIRATION_TIMESTAMP}}" \
              "https://${REGISTRY}/api/v1/repository/${NAMESPACE}/${REPO}/tag/${TAG}")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" -ne 200 ] && [ "$HTTP_CODE" -ne 201 ]; then
              echo "Warning: Failed to set expiration on ${TAG} (HTTP $HTTP_CODE): $BODY"
              echo "This may be due to using a robot account token instead of an OAuth application token"
            else
              echo "✓ Expiration set successfully on ${TAG}"
            fi
          done < /tmp/expiry-tags.txt

      # Remove the temporary per-arch build tags. The arch images stay in the
      # registry by digest, referenced by the manifest list.
      - name: Clean up per-arch build tags
        if: always()
        env:
          API_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN || secrets.QUAY_TOKEN }}
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE: ${{ env.IMAGE_NAME }}
          SHORT_SHA: ${{ needs.prepare.outputs.short-sha }}
        run: |
          if [ -z "${API_TOKEN}" ]; then
            echo "No API token available; skipping arch tag cleanup"
            exit 0
          fi

          NAMESPACE=$(echo "${IMAGE}" | cut -d'/' -f1)
          REPO=$(echo "${IMAGE}" | cut -d'/' -f2)

          for ARCH in amd64 arm64; do
            TAG="${SHORT_SHA}-arch-${ARCH}"
            RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${API_TOKEN}" \
              "https://${REGISTRY}/api/v1/repository/${NAMESPACE}/${REPO}/tag/${TAG}")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 204 ]; then
              echo "✓ Deleted arch build tag: ${TAG}"
            else
              echo "Warning: Failed to delete arch build tag ${TAG} (HTTP $HTTP_CODE); it can be removed manually"
            fi
          done

      # Sign the resulting image digests
      # https://github.com/sigstore/cosign
      - name: Sign the published images
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # Sign all tags
          while IFS= read -r tag; do
            echo "Signing ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done < /tmp/image-tags.txt

      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          REGISTRY: ${{ vars.REGISTRY }}
          MAIN_TAG: ${{ needs.prepare.outputs.image-tag }}
          EXTRA_TAGS: ${{ needs.prepare.outputs.extra-tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: ${REGISTRY}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: Hermetic (\`--network=none\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "- **Main Tag**: \`${MAIN_TAG}\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "${EXTRA_TAGS}" ]; then
            echo "- **Extra Tags**:" >> $GITHUB_STEP_SUMMARY
            for TAG in ${EXTRA_TAGS}; do
              echo "  - \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
            done
          fi
          echo "- **Digest**: \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Signed**: ✅" >> $GITHUB_STEP_SUMMARY
