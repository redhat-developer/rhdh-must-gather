# TODO(rm3l): once 2.2 is the minimum supported version, remove single-arch
# fallback (all supported branches will produce multi-arch artifacts).
name: PR Push

on:
  workflow_run:
    workflows: ["PR Build"]
    types:
      - completed

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: rhdh-must-gather

jobs:
  pr-push:
    name: Push PR Container Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      pull-requests: write
      actions: read

    steps:

      - name: Get the PR number from the workflow run
        id: pr-number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const branch = context.payload.workflow_run.head_branch;
            const headRepoOwner = context.payload.workflow_run.head_repository?.owner?.login;
            const isFork = headRepoOwner && headRepoOwner !== context.repo.owner;

            console.log(`Commit SHA: ${sha}`);
            console.log(`Branch: ${branch}`);
            console.log(`Head repo owner: ${headRepoOwner}`);
            console.log(`Is fork: ${isFork}`);

            // Method 1: Try to get PR from workflow_run.pull_requests (works for non-fork PRs)
            const workflowPRs = context.payload.workflow_run.pull_requests || [];
            if (workflowPRs.length > 0) {
              console.log(`Found PR #${workflowPRs[0].number} from workflow_run.pull_requests`);
              core.setOutput("number", workflowPRs[0].number);
              return;
            }
            console.log("No PRs in workflow_run.pull_requests, trying API lookup...");

            // Method 2: Try listPullRequestsAssociatedWithCommit
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });

            console.log(`Found ${pulls.length} PR(s) via listPullRequestsAssociatedWithCommit`);
            pulls.forEach(p => console.log(`  - PR #${p.number}: state=${p.state}`));

            // Bind the PR to this run's head branch and repository, so a
            // different PR that happens to share the head SHA (e.g. a fork
            // pushing the same commit) cannot capture another PR's pr-<N> tag.
            let pr = pulls.find(p =>
              p.state === "open" &&
              p.head.ref === branch &&
              p.head.repo?.full_name === context.payload.workflow_run.head_repository?.full_name
            );

            // Method 3: If no results and this is a fork, try searching by branch
            if (!pr && isFork) {
              console.log(`Trying branch-based lookup for fork: ${headRepoOwner}:${branch}`);
              const { data: branchPulls } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                head: `${headRepoOwner}:${branch}`,
              });
              console.log(`Found ${branchPulls.length} PR(s) via branch lookup`);
              pr = branchPulls[0];
            }

            if (!pr) {
              core.setFailed(`No open PR found for commit ${sha}`);
              return;
            }

            console.log(`Using PR #${pr.number}`);
            core.setOutput("number", pr.number);

      - name: Check if build artifacts exist
        id: check-artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const names = artifacts.map(a => a.name);
            const hasAmd64 = names.includes('pr-image-amd64');
            const hasArm64 = names.includes('pr-image-arm64');
            const hasLegacy = names.includes('pr-image');

            if (hasAmd64 && hasArm64) {
              console.log(`Multi-arch artifacts (pr-image-amd64, pr-image-arm64) for run ${runId}: found`);
              core.setOutput('exists', true);
              core.setOutput('mode', 'multi-arch');
            } else if (hasAmd64 !== hasArm64) {
              core.setFailed(`Incomplete multi-arch artifacts for run ${runId}; missing: ${hasAmd64 ? 'pr-image-arm64' : 'pr-image-amd64'}`);
            } else if (hasLegacy) {
              console.log(`Legacy single-arch artifact (pr-image) for run ${runId}: found`);
              core.setOutput('exists', true);
              core.setOutput('mode', 'single-arch');
            } else {
              console.log(`No PR image artifacts for run ${runId} (docs-only or skipped build)`);
              core.setOutput('exists', false);
            }

      - name: Download amd64 artifact from build workflow
        if: steps.check-artifact.outputs.exists == 'true' && steps.check-artifact.outputs.mode == 'multi-arch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pr-image-amd64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download arm64 artifact from build workflow
        if: steps.check-artifact.outputs.exists == 'true' && steps.check-artifact.outputs.mode == 'multi-arch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pr-image-arm64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download single-arch artifact from build workflow
        if: steps.check-artifact.outputs.exists == 'true' && steps.check-artifact.outputs.mode == 'single-arch'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pr-image
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Load and Validate Metadata
        if: steps.check-artifact.outputs.exists == 'true'
        id: meta
        env:
          EXPECTED_PR: ${{ steps.pr-number.outputs.number }}
          TRUSTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ ! -f metadata.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Use -e to fail fast on malformed JSON
          if ! jq -e . metadata.json >/dev/null 2>&1; then
            echo "Invalid JSON" && exit 1
          fi

          # 1. Validate PR_NUMBER (Integer only)
          PR_NUM=$(jq -r '.pr_number | select(type == "number")' metadata.json)
          if [[ -z "$PR_NUM" ]]; then
            echo "::error::Invalid or missing PR_NUMBER"
            exit 1
          fi
          if [ "$EXPECTED_PR" != "$PR_NUM" ]; then
            echo "::error::Security alert: mismatched PR context (expected ${EXPECTED_PR}, got ${PR_NUM}). Possible artifact poisoning."
            exit 1
          fi

          # 2. Derive tags from trusted PR context — never trust artifact-supplied
          # image_tag or unconstrained extra_tags (fork PRs can poison artifacts).
          # PR images may only occupy pr-<N> and pr-<N>-<shortsha>.
          IMAGE_TAG="pr-${EXPECTED_PR}"
          TRUSTED_SHORT_SHA="${TRUSTED_HEAD_SHA:0:9}"

          ARTIFACT_TAG=$(jq -r '.image_tag // ""' metadata.json)
          if [[ -n "$ARTIFACT_TAG" && "$ARTIFACT_TAG" != "$IMAGE_TAG" ]]; then
            echo "::warning::Ignoring artifact image_tag '${ARTIFACT_TAG}'; using trusted tag '${IMAGE_TAG}'"
          fi

          # Validate EXTRA_TAGS: must match pr-<N>-<shortsha> where shortsha
          # is cross-validated against the trusted workflow_run head SHA.
          EXTRA_TAGS_RAW=$(jq -r '.extra_tags // ""' metadata.json)
          EXTRA_TAGS=""
          TRUSTED_EXTRA_TAG="pr-${EXPECTED_PR}-${TRUSTED_SHORT_SHA}"
          for tag in $EXTRA_TAGS_RAW; do
            if [ "$tag" = "$TRUSTED_EXTRA_TAG" ]; then
              EXTRA_TAGS="${EXTRA_TAGS:+$EXTRA_TAGS }$tag"
            else
              echo "::warning::Skipping untrusted extra tag: $tag (expected ${TRUSTED_EXTRA_TAG})"
            fi
          done

          # 3. Validate VERSION (Allow alphanumeric, dot, dash)
          # We sanitize this because we print it to the Summary later
          VERSION=$(jq -r '.version' metadata.json | grep -E '^[a-zA-Z0-9._-]+$')
          if [[ -z "$VERSION" ]]; then
             VERSION="unknown"
          fi

          # 4. Safe Exports
          echo "SAFE_PR_NUMBER=$PR_NUM" >> "$GITHUB_ENV"
          echo "SAFE_IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "SAFE_EXTRA_TAGS=$EXTRA_TAGS" >> "$GITHUB_ENV"
          echo "SAFE_VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "EXPIRATION_TIMESTAMP=$(date -u -d "+7 days" +"%s")" >> "$GITHUB_ENV"

      - name: Load per-arch images from tarballs (multi-arch)
        if: steps.check-artifact.outputs.exists == 'true' && steps.meta.outputs.skip != 'true' && steps.check-artifact.outputs.mode == 'multi-arch'
        env:
          NAME: ${{ env.IMAGE_NAME }}
          TAG: ${{ env.SAFE_IMAGE_TAG }}
        run: |
          set -euo pipefail
          gunzip -c image-amd64.tar.gz | podman load
          gunzip -c image-arm64.tar.gz | podman load

          # Artifacts are saved with trusted arch-suffixed tags derived from the
          # PR number (SAFE_IMAGE_TAG). Refuse unexpected local names.
          for ARCH in amd64 arm64; do
            LOCAL="${NAME}:${TAG}-${ARCH}"
            if ! podman image exists "${LOCAL}"; then
              echo "::error::Expected local image ${LOCAL} after load"
              podman images
              exit 1
            fi
            ACTUAL_ARCH=$(podman image inspect --format '{{.Architecture}}' "${LOCAL}")
            if [[ "${ACTUAL_ARCH}" != "${ARCH}" ]]; then
              echo "::error::Image ${LOCAL} reports architecture '${ACTUAL_ARCH}', expected '${ARCH}'"
              exit 1
            fi
            echo "Loaded ${LOCAL} (${ACTUAL_ARCH})"
          done

      - name: Load image from tarball (single-arch)
        if: steps.check-artifact.outputs.exists == 'true' && steps.meta.outputs.skip != 'true' && steps.check-artifact.outputs.mode == 'single-arch'
        env:
          NAME: ${{ env.IMAGE_NAME }}
          TAG: ${{ env.SAFE_IMAGE_TAG }}
        run: |
          set -euo pipefail
          gunzip -c image.tar.gz | podman load
          if ! podman image exists "${NAME}:${TAG}"; then
            echo "::error::Expected local image ${NAME}:${TAG} after load"
            podman images
            exit 1
          fi
          echo "Loaded ${NAME}:${TAG}"

      - name: Log into registry ${{ vars.REGISTRY }}
        if: steps.check-artifact.outputs.exists == 'true' && steps.meta.outputs.skip != 'true'
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ vars.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Push multi-arch manifest lists
        if: steps.check-artifact.outputs.exists == 'true' && steps.meta.outputs.skip != 'true' && steps.check-artifact.outputs.mode == 'multi-arch'
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_ORG: ${{ vars.REGISTRY_ORG }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          MAIN_TAG: ${{ env.SAFE_IMAGE_TAG }}
          EXTRA_TAGS: ${{ env.SAFE_EXTRA_TAGS }}
        run: |
          set -euo pipefail

          IMAGE_REF="${REGISTRY}/${REGISTRY_ORG}/${IMAGE_NAME}"
          AMD64_LOCAL="${IMAGE_NAME}:${MAIN_TAG}-amd64"
          ARM64_LOCAL="${IMAGE_NAME}:${MAIN_TAG}-arm64"

          for TAG in ${MAIN_TAG} ${EXTRA_TAGS}; do
            REF="${IMAGE_REF}:${TAG}"
            echo "Creating multi-arch manifest list for ${REF}"
            podman manifest rm "${REF}" >/dev/null 2>&1 || true
            podman manifest create "${REF}"
            podman manifest add "${REF}" "${AMD64_LOCAL}"
            podman manifest add "${REF}" "${ARM64_LOCAL}"
            podman manifest push --all "${REF}"
          done

      - name: Push single-arch image
        if: steps.check-artifact.outputs.exists == 'true' && steps.meta.outputs.skip != 'true' && steps.check-artifact.outputs.mode == 'single-arch'
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_ORG: ${{ vars.REGISTRY_ORG }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          MAIN_TAG: ${{ env.SAFE_IMAGE_TAG }}
          EXTRA_TAGS: ${{ env.SAFE_EXTRA_TAGS }}
        run: |
          set -euo pipefail

          IMAGE_REF="${REGISTRY}/${REGISTRY_ORG}/${IMAGE_NAME}"

          for TAG in ${MAIN_TAG} ${EXTRA_TAGS}; do
            REF="${IMAGE_REF}:${TAG}"
            echo "Pushing ${REF}"
            podman tag "${IMAGE_NAME}:${MAIN_TAG}" "${REF}"
            podman push "${REF}"
          done

      - name: Set expiration on PR images
        if: steps.check-artifact.outputs.exists == 'true' && steps.meta.outputs.skip != 'true'
        env:
          API_TOKEN: ${{ secrets.QUAY_OAUTH_TOKEN || secrets.QUAY_TOKEN }}
        run: |
          set_tag_expiration() {
            local tag="$1"
            local url="https://${{ vars.REGISTRY }}/api/v1/repository/${{ vars.REGISTRY_ORG }}/${{ env.IMAGE_NAME }}/tag/${tag}"
            
            echo "Setting expiration for tag: ${tag}"
            echo "Expiration timestamp: ${EXPIRATION_TIMESTAMP} ($(date -d @${EXPIRATION_TIMESTAMP} -u))"
            
            response=$(curl -s -w "\n%{http_code}" -X PUT \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"expiration\": ${EXPIRATION_TIMESTAMP}}" \
              "${url}")
            
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            
            echo "HTTP Status: ${http_code}"
            echo "Response: ${body}"
            
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::warning::Failed to set expiration for tag ${tag} (HTTP ${http_code})"
              return 1
            fi
          }

          # Set expiration on main tag (continue on failure)
          set_tag_expiration "${SAFE_IMAGE_TAG}" || true

          # Set expiration on extra tags if present
          for tag in $SAFE_EXTRA_TAGS; do
            set_tag_expiration "${tag}" || true
          done

      - name: Comment image links in PR
        if: steps.check-artifact.outputs.exists == 'true' && steps.meta.outputs.skip != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUM: ${{ env.SAFE_PR_NUMBER }}
          MAIN_TAG: ${{ env.SAFE_IMAGE_TAG }}
          EXTRA_TAGS: ${{ env.SAFE_EXTRA_TAGS }}
          REGISTRY: ${{ vars.REGISTRY }}
          REGISTRY_ORG: ${{ vars.REGISTRY_ORG }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          BUILD_MODE: ${{ steps.check-artifact.outputs.mode }}
        with:
          script: |
            // Safe: using process.env avoids code injection
            const prNumber = parseInt(process.env.PR_NUM);
            const mainTag = process.env.MAIN_TAG;
            const extraTags = process.env.EXTRA_TAGS ? process.env.EXTRA_TAGS.split(' ').filter(Boolean) : [];
            const registry = process.env.REGISTRY;
            const registryOrg = process.env.REGISTRY_ORG;
            const imageName = process.env.IMAGE_NAME;
            const buildMode = process.env.BUILD_MODE;

            const baseUrl = `${registry}/${registryOrg}/${imageName}`;
            const allTags = [mainTag, ...extraTags];
            const tagList = allTags.map(tag => `<li><code>${baseUrl}:${tag}</code></li>`).join('\n');

            const archInfo = buildMode === 'multi-arch'
              ? 'multi-arch (`linux/amd64`, `linux/arm64`)'
              : '`linux/amd64`';

            const shaTag = extraTags.length > 0 ? extraTags[0] : mainTag;
            const fullImage = `${baseUrl}:${shaTag}`;
            const headSha = context.payload.workflow_run.head_sha;
            const headRepo = context.payload.workflow_run.head_repository.full_name;
            const scriptUrl = `https://raw.githubusercontent.com/${headRepo}/${headSha}/hack/deploy-k8s.sh`;

            const releaseName = 'my-rhdh-must-gather';
            const podSelector = `app.kubernetes.io/instance=${releaseName},app.kubernetes.io/component=gather`;

            const usage = [
              ``,
              `<details>`,
              `<summary>Usage</summary>`,
              ``,
              `#### OpenShift`,
              `\`\`\`bash`,
              `oc adm must-gather --image=${fullImage} [-- /usr/bin/gather --with-heap-dumps]`,
              `\`\`\``,
              ``,
              `#### Kubernetes`,
              `Using the helper script (no clone needed):`,
              `\`\`\`bash`,
              `curl -sSL ${scriptUrl} | bash -s -- --image ${fullImage} [--opts "--with-heap-dumps"]`,
              `\`\`\``,
              ``,
              `Or manually with Helm + kubectl:`,
              `\`\`\`bash`,
              `# 1. Install`,
              `helm install ${releaseName} redhat-developer-hub-must-gather \\`,
              `  --repo https://redhat-developer.github.io/rhdh-chart \\`,
              `  --set image.tag=${shaTag} \\`,
              `  [--set gather.heapDump.enabled=true]`,
              ``,
              `# 2. Wait for the gather to complete`,
              `kubectl wait --for=condition=ready pod \\`,
              `  -l ${podSelector} \\`,
              `  --timeout=3600s`,
              ``,
              `# 3. Download the collected data`,
              `kubectl exec deploy/${releaseName} -c data-holder -- \\`,
              `  tar czf - -C /must-gather . > rhdh-must-gather-output.tar.gz`,
              ``,
              `# 4. Clean up`,
              `helm uninstall ${releaseName}`,
              `\`\`\``,
              ``,
              `See [Quick start](https://github.com/${headRepo}/blob/${headSha}/README.md#quick-start) for more details.`,
              ``,
              `</details>`,
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `PR images are available (for 1 week) — ${archInfo}:\n<ol>\n${tagList}\n</ol>\n${usage}`
            })

      - name: Summary
        if: steps.check-artifact.outputs.exists == 'true' && steps.meta.outputs.skip != 'true'
        env:
          BUILD_MODE: ${{ steps.check-artifact.outputs.mode }}
        run: |
          ALL_TAGS="\`${{ env.SAFE_IMAGE_TAG }}\`"

          # FIXED: Use env var to avoid syntax error if empty
          for tag in $SAFE_EXTRA_TAGS; do
            ALL_TAGS="${ALL_TAGS}, \`${tag}\`"
          done

          if [ "$BUILD_MODE" = "multi-arch" ]; then
            PLATFORMS="linux/amd64, linux/arm64"
            STATUS="Multi-arch manifest list pushed and expiration set"
          else
            PLATFORMS="linux/amd64"
            STATUS="Single-arch image pushed and expiration set"
          fi

          echo "### Push Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ env.SAFE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Number**: ${{ env.SAFE_PR_NUMBER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms**: ${PLATFORMS}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${STATUS}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: ${ALL_TAGS}" >> $GITHUB_STEP_SUMMARY

      - name: Summary (skipped - no artifact)
        if: steps.check-artifact.outputs.exists != 'true'
        run: |
          echo "### Push Skipped" >> $GITHUB_STEP_SUMMARY
          echo "No PR image artifacts (\`pr-image-amd64\`/\`pr-image-arm64\` or \`pr-image\`) were produced by the PR Build workflow." >> $GITHUB_STEP_SUMMARY
          echo "This is expected when the PR changes don't affect the container image (e.g., docs-only changes)." >> $GITHUB_STEP_SUMMARY
