name: Update RPM Lockfile

on:
  workflow_dispatch:
  schedule:
    # Run at 3AM UTC every Monday
    - cron: '0 3 * * 1'
  push:
    branches:
      - main
      - 'release-[0-9]+.[0-9]+'
    paths:
      - 'rpms.in.yaml'
      - '.rhdh/docker/Containerfile'
      - '.github/workflows/update-rpm-lockfile.yaml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - 'release-[0-9]+.[0-9]+'
    paths:
      - 'rpms.in.yaml'
      - '.rhdh/docker/Containerfile'
      - '.github/workflows/update-rpm-lockfile.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CONTAINERFILE_PATH: .rhdh/docker/Containerfile
  # To revert to main (e.g. broken release): set to 'main', change refs/tags/ to refs/heads/ in the install step, and remove the renovate comment
  # renovate: datasource=github-releases depName=konflux-ci/rpm-lockfile-prototype
  RPM_LOCKFILE_PROTOTYPE_VERSION: v0.30.1

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require RHDH_BOT_TOKEN
        if: github.event_name != 'pull_request'
        env:
          RHDH_BOT_TOKEN: ${{ secrets.RHDH_BOT_TOKEN }}
        run: |
          if [[ -z "${RHDH_BOT_TOKEN}" ]]; then
            echo "::error::RHDH_BOT_TOKEN must be configured as a repo secret (rhdh-bot PAT). There is no GITHUB_TOKEN fallback."
            exit 1
          fi

      - name: Check if hermetic Containerfile exists
        run: |
          if [ ! -f "${{ env.CONTAINERFILE_PATH }}" ]; then
            echo "Error: ${{ env.CONTAINERFILE_PATH }} not found!"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --global user.name "rhdh-bot"
          git config --global user.email "rhdh-bot@redhat.com"

      - name: Install rpm-lockfile-prototype
        run: |
          if [[ ! -x "${HOME}/.local/bin/rpm-lockfile-prototype" ]]; then
            echo "Installing rpm-lockfile-prototype ..."
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip python3-dev build-essential
            sudo apt-get install -y podman skopeo rpm
            sudo apt-get install -y dnf python3-dnf
            mkdir -p "${HOME}/.local/bin/"
            python3 -m pip install --user "https://github.com/konflux-ci/rpm-lockfile-prototype/archive/refs/tags/${RPM_LOCKFILE_PROTOTYPE_VERSION}.zip"
            export PATH=${PATH%":${HOME}/.local/bin"}:${HOME}/.local/bin
            echo "${HOME}/.local/bin" >> $GITHUB_PATH
          else
            echo "rpm-lockfile-prototype already installed"
          fi

      - name: Run rpm-lockfile-prototype
        run: |
          echo "Running '${HOME}/.local/bin/rpm-lockfile-prototype -f ${{ env.CONTAINERFILE_PATH }} rpms.in.yaml' in $(pwd)"
          ${HOME}/.local/bin/rpm-lockfile-prototype -f ${{ env.CONTAINERFILE_PATH }} rpms.in.yaml

      - name: Check for lockfile changes
        id: check-lockfile-changes
        run: |
          if git diff --quiet rpms.lock.yaml; then
            echo "No changes to rpms.lock.yaml detected"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in rpms.lock.yaml"
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      # --- PR trigger: auto-commit and push back to the PR branch ---

      - name: Auto-commit and push updated lockfile
        id: autopush
        if: github.event_name == 'pull_request' && steps.check-lockfile-changes.outputs.changes == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          RHDH_BOT_TOKEN: ${{ secrets.RHDH_BOT_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ -z "${RHDH_BOT_TOKEN}" || -z "${HEAD_REF}" ]]; then
            echo "::warning::RHDH_BOT_TOKEN or HEAD_REF is not set, skipping auto-push"
            exit 0
          fi
          git remote set-url origin "https://x-access-token:${RHDH_BOT_TOKEN}@github.com/${{ github.repository }}.git"
          git add rpms.lock.yaml
          git commit -m "chore: update rpms.lock.yaml"
          if git push origin "HEAD:${HEAD_REF}"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            git reset --mixed HEAD~1
          fi

      - name: Fail if lockfile is out of sync
        if: github.event_name == 'pull_request' && steps.check-lockfile-changes.outputs.changes == 'true' && steps.autopush.outputs.pushed != 'true'
        run: |
          echo "::error::rpms.lock.yaml is out of sync with rpms.in.yaml"
          echo ""
          echo "❌ The RPM lockfile needs to be regenerated."
          echo ""
          echo "This usually happens when you modify:"
          echo "  - rpms.in.yaml"
          echo "  - .rhdh/docker/Containerfile"
          echo ""
          echo "To fix this, run:"
          echo "  pip install https://github.com/konflux-ci/rpm-lockfile-prototype/archive/refs/tags/${RPM_LOCKFILE_PROTOTYPE_VERSION}.zip"
          echo "  rpm-lockfile-prototype -f ${{ env.CONTAINERFILE_PATH }} rpms.in.yaml"
          echo "  git add rpms.lock.yaml"
          echo "  git commit -m 'chore: update rpms.lock.yaml'"
          echo "  git push"
          exit 1

      # --- Push/schedule/dispatch trigger: create a standalone PR ---

      - name: Determine target branch
        if: github.event_name != 'pull_request' && steps.check-lockfile-changes.outputs.changes == 'true'
        id: target-branch
        run: |
          TARGET_BRANCH="${{ github.ref_name }}"
          echo "name=${TARGET_BRANCH}" >> $GITHUB_OUTPUT
          echo "Target branch: ${TARGET_BRANCH}"

      - name: Check if update PR already exists
        if: github.event_name != 'pull_request' && steps.check-lockfile-changes.outputs.changes == 'true'
        id: existing-pr
        env:
          GH_TOKEN: ${{ secrets.RHDH_BOT_TOKEN }}
          BRANCH: chore/automated-update-rpm-lockfile/${{ steps.target-branch.outputs.name }}
        run: |
          pr_count=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          echo "exists=$([ "$pr_count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Push updated lockfile to PR branch
        if: github.event_name != 'pull_request' && steps.check-lockfile-changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.RHDH_BOT_TOKEN }}
          BRANCH: chore/automated-update-rpm-lockfile/${{ steps.target-branch.outputs.name }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git checkout -B "$BRANCH"
          git add rpms.lock.yaml
          git commit -m "chore: update rpms.lock.yaml [skip-build]"
          git push -u origin "$BRANCH" --force-with-lease

      - name: Create Pull Request
        if: github.event_name != 'pull_request' && steps.check-lockfile-changes.outputs.changes == 'true' && steps.existing-pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.RHDH_BOT_TOKEN }}
          TARGET_BRANCH: ${{ steps.target-branch.outputs.name }}
        run: |
          gh pr create \
            --base "${TARGET_BRANCH}" \
            --title "chore: update RPM lockfile in branch (${TARGET_BRANCH}) [skip-build]" \
            --body "$(cat <<EOF
          ## Description

          This PR updates the \`rpms.lock.yaml\` file with the latest package versions based on current \`rpms.in.yaml\` configuration using \`${{ env.CONTAINERFILE_PATH }}\` as the base container context.

          Auto-generated by the [Update RPM Lockfile workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          EOF
          )"

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ steps.check-lockfile-changes.outputs.changes }}" == "true" ]; then
            echo "RPM lockfile updated and PR created/updated"
          else
            echo "No changes detected in RPM lockfile"
          fi
