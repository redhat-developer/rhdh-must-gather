name: Nightly E2E Tests

on:
  schedule:
    - cron: '38 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: Nightly E2E Tests (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch:
          - main
          - release-1.10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
      
      - name: Set branch test variables
        run: | 
          branch="${{ matrix.branch }}"
          echo "TARGET_BRANCH=${branch}" >> "$GITHUB_ENV"
          if [ "$branch" = "main" ]; then 
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=latest-${branch#release-}" >> "$GITHUB_ENV"
          fi
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq skopeo
          # Install yq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Create Kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: rhdh-must-gather-e2e
          wait: 120s

      - name: Run E2E tests
        run: >
          make test-e2e
          LOCAL=false
          TARGET_BRANCH=${{ env.TARGET_BRANCH }}
          IMAGE_TAG=${{ env.IMAGE_TAG }}
          HELM_TIMEOUT=${{ vars.E2E_HELM_TIMEOUT || '25m' }}

      - name: Display must-gather process logs
        if: ${{ success() || failure() }}
        run: |
          cat rhdh-must-gather-output.k8s.*/must-gather.log || true

      - name: Upload E2E must-gather output in case of failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-must-gather-output-nightly-${{ matrix.branch }}
          path: e2e-cluster.mustgather.tar.gz
          retention-days: 7

      - name: Upload must-gather output
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: must-gather-output-nightly-${{ matrix.branch }}
          path: |
            rhdh-must-gather-output.k8s.*.tar.gz
            rhdh-must-gather-output.k8s.*/
          retention-days: 7

  e2e-tests-heap-dumps:
    name: Nightly E2E Tests Heap Dumps (${{ matrix.branch }} - ${{ matrix.method }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch: 
          - main
          - release-1.10
        method: [auto, inspector, sigusr2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Set branch test variables
        run: | 
          branch="${{ matrix.branch }}"
          echo "TARGET_BRANCH=${branch}" >> "$GITHUB_ENV"
          if [ "$branch" = "main" ]; then
            echo "IMAGE_TAG=latest" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=latest-${branch#release-}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq skopeo
          # Install yq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Create Kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: rhdh-must-gather-e2e-heap-${{ matrix.method }}
          wait: 120s

      - name: Run E2E tests with heap dumps (${{ matrix.method }} method)
        run: |
          if [ "${{ matrix.method }}" = "auto" ]; then
            make test-e2e LOCAL=false WITH_HEAP_DUMPS=true \
            TARGET_BRANCH=${{ env.TARGET_BRANCH }} \
            IMAGE_TAG=${{ env.IMAGE_TAG }} \
            HELM_TIMEOUT=${{ vars.E2E_HELM_TIMEOUT || '25m' }}
          else
            make test-e2e LOCAL=false WITH_HEAP_DUMPS=true \
              HEAP_DUMP_METHOD=${{ matrix.method }} \
              TARGET_BRANCH=${{ env.TARGET_BRANCH }} \
              IMAGE_TAG=${{ env.IMAGE_TAG }} \
              HELM_TIMEOUT=${{ vars.E2E_HELM_TIMEOUT || '25m' }}
          fi

      - name: Display must-gather process logs
        if: ${{ success() || failure() }}
        run: |
          cat rhdh-must-gather-output.k8s.*/must-gather.log || true

      - name: Upload E2E must-gather output in case of failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-must-gather-output-heap-dumps-${{ matrix.method }}-${{ matrix.branch }}-nightly
          path: e2e-cluster.mustgather.tar.gz
          retention-days: 7

      - name: Upload must-gather output
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: must-gather-output-heap-dumps-${{ matrix.branch }}-${{ matrix.method }}-nightly
          path: |
            rhdh-must-gather-output.k8s.*.tar.gz
            rhdh-must-gather-output.k8s.*/
          retention-days: 7
