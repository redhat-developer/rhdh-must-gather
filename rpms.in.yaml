# after editing, run (https://github.com/konflux-ci/rpm-lockfile-prototype):
#   rpm-lockfile-prototype -f .rhdh/docker/Containerfile rpms.in.yaml
# to regen rpms.lock.yaml
# Note that the repoid values are special, and must be from here:
# https://github.com/release-engineering/rhtap-ec-policy/blob/main/data/known_rpm_repositories.yml
arches:
  - x86_64
  - aarch64
allowerasing: true
contentOrigin:
  repos:
    - repoid: ubi-10-for-$basearch-baseos-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi10/10/$basearch/baseos/os/
    - repoid: ubi-10-for-$basearch-baseos-source-rpms
      baseurl: https://cdn-ubi.redhat.com/content/public/ubi/dist/ubi10/10/$basearch/baseos/source/SRPMS

# New installs beyond base image
packages:
  - rsync
  - shadow-utils
  - tar
  - util-linux
